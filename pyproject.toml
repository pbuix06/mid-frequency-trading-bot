[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mft"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Data
    "pandas>=2.2",
    "polars>=0.20",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    # Science
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    # Backtesting (research, fast)
    "vectorbt",
    # Vol/stats modeling
    "arch>=6.3",
    # Visualization / reporting
    "matplotlib>=3.8",
    "plotly>=5.18",
    "quantstats>=0.0.62",
    # Config & utilities
    "pyyaml>=6.0",
    "rich>=13.0",
    # HTTP & env
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "ipykernel>=6.28",
]
# Install separately when ready: nautilus_trader has heavy C++ deps
nautilus = [
    "nautilus_trader>=1.190",
]

[tool.hatch.build.targets.wheel]
packages = ["mft"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mft"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
